name: Check Base Image Updates

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE_NAME: python:3.13-slim

jobs:
  check-base-image:
    runs-on: ubuntu-latest
    concurrency:
      group: container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare base image digests
        id: check
        run: |
          set -euo pipefail

          image_repo="${REGISTRY}/${IMAGE_NAME,,}"
          published_image="${image_repo}:latest"
          config_json="$(crane config "${published_image}")"

          current_base_digest="$(jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' <<<"${config_json}")"
          current_revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<<"${config_json}")"
          current_version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<<"${config_json}")"

          if [ -z "${current_revision}" ]; then
            echo "::error::${published_image} is missing org.opencontainers.image.revision" >&2
            exit 1
          fi
          if [ -z "${current_version}" ]; then
            echo "::error::${published_image} is missing org.opencontainers.image.version" >&2
            exit 1
          fi

          upstream_digest="$(crane digest "${BASE_IMAGE_NAME}")"
          if [ -z "${current_base_digest}" ] || [ "${current_base_digest}" != "${upstream_digest}" ]; then
            changed=true
          else
            changed=false
          fi

          {
            echo "image_repo=${image_repo}"
            echo "published_image=${published_image}"
            echo "current_base_digest=${current_base_digest}"
            echo "current_revision=${current_revision}"
            echo "current_version=${current_version}"
            echo "upstream_digest=${upstream_digest}"
            echo "changed=${changed}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set rebuild metadata
        if: steps.check.outputs.changed == 'true'
        id: rebuild_meta
        run: |
          echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Checkout published revision
        if: steps.check.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.check.outputs.current_revision }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        if: steps.check.outputs.changed == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Run release test gate
        if: steps.check.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Rebuild and push image
        if: steps.check.outputs.changed == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ steps.check.outputs.image_repo }}:latest
            ${{ steps.check.outputs.image_repo }}:base-refresh-${{ steps.rebuild_meta.outputs.timestamp }}
          build-args: |
            VERSION=${{ steps.check.outputs.current_version }}
            BUILD_DATE=${{ steps.rebuild_meta.outputs.build_date }}
            VCS_REF=${{ steps.check.outputs.current_revision }}
            BASE_IMAGE_REF=${{ env.BASE_IMAGE_NAME }}@${{ steps.check.outputs.upstream_digest }}
            BASE_IMAGE_NAME=${{ env.BASE_IMAGE_NAME }}
            BASE_IMAGE_DIGEST=${{ steps.check.outputs.upstream_digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Base image check: ${BASE_IMAGE_NAME}"
            echo
            if [ "${{ steps.check.outcome }}" != "success" ]; then
              echo "- Result: **operational failure** while checking image metadata"
            elif [ "${{ steps.check.outputs.changed }}" = "true" ]; then
              echo "- Published image: \`${{ steps.check.outputs.published_image }}\`"
              echo "- Previous base digest: \`${{ steps.check.outputs.current_base_digest || 'none recorded (bootstrap)' }}\`"
              echo "- Current upstream digest: \`${{ steps.check.outputs.upstream_digest }}\`"
              if [ "${{ steps.build.outcome }}" = "success" ]; then
                echo "- Result: rebuilt version \`${{ steps.check.outputs.current_version }}\` from revision \`${{ steps.check.outputs.current_revision }}\`"
              else
                echo "- Result: change detected but tests or build failed; nothing was published"
              fi
            else
              echo "- Published image: \`${{ steps.check.outputs.published_image }}\`"
              echo "- Current base digest: \`${{ steps.check.outputs.upstream_digest }}\`"
              echo "- Result: unchanged"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify bex
        if: always() && (job.status != 'success' || steps.check.outputs.changed == 'true')
        env:
          BEX_NOTIFY_WEBHOOK_URL: ${{ secrets.BEX_NOTIFY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          set -euo pipefail
          if [ -z "${BEX_NOTIFY_WEBHOOK_URL:-}" ]; then
            echo "BEX_NOTIFY_WEBHOOK_URL is not configured - skipping notification"
            exit 0
          fi

          message="${GITHUB_REPOSITORY} base image check ${STATUS}; base=${BASE_IMAGE_NAME}; changed=${CHANGED:-unknown}; run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n --arg message "${message}" '{message:$message}')"
          curl --fail --silent --show-error --max-time 10 \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${BEX_NOTIFY_WEBHOOK_URL}"
